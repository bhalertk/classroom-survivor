<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
  <title id="title">敵人 20 飛踢重擊手招式圖</title>
  <desc id="desc">左側示範沿直線衝刺的飛踢；右側示範前方扇形重擊。飛踢向側面閃，重擊離開扇形。</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#624a4a"/><stop offset="1" stop-color="#2e3440"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#ffd294"/></marker>
    <g id="fighter" stroke="#754d4a" stroke-width="4" stroke-linejoin="round">
      <rect x="-19" y="-47" width="38" height="31" rx="4" fill="#cb8a76"/>
      <rect x="-16" y="-50" width="32" height="8" rx="3" fill="#ffd29a"/>
      <rect x="-17" y="-15" width="34" height="35" rx="4" fill="#9d5b55"/>
      <rect x="-28" y="-8" width="11" height="19" rx="3" fill="#e9b38b"/>
      <rect x="17" y="-8" width="11" height="19" rx="3" fill="#e9b38b"/>
      <rect x="-15" y="18" width="11" height="15" rx="2" fill="#565262"/>
      <rect x="4" y="18" width="11" height="15" rx="2" fill="#565262"/>
      <path d="M-9 -31h4m10 0h4" stroke="#49373e" stroke-width="5"/>
    </g>
  </defs>
  <rect width="800" height="280" rx="18" fill="url(#bg)"/>
  <path d="M400 16v248" stroke="#99736b" stroke-width="2" stroke-dasharray="7 8"/>
  <text x="24" y="36" fill="#fff0da" font-size="22" font-weight="900" font-family="sans-serif">ENEMY 20 | FLYING KICKER</text>
  <text x="28" y="74" fill="#ffe0b7" font-size="18" font-weight="800" font-family="sans-serif">01 FLYING KICK | 0.65s</text>
  <ellipse cx="102" cy="197" rx="41" ry="11" fill="#2e2834"/>
  <use href="#fighter" xlink:href="#fighter" xmlns:xlink="http://www.w3.org/1999/xlink" x="102" y="175"/>
  <path d="M149 170 H335" stroke="#ffd294" stroke-width="23" opacity=".18"/>
  <path d="M149 170 H335" stroke="#ffd294" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <path d="M253 142 L271 119" stroke="#b9f0e1" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="217" y="237" fill="#ffedbd" font-size="17" font-weight="700" font-family="sans-serif">DODGE SIDEWAYS</text>
  <text x="431" y="74" fill="#ffe0b7" font-size="18" font-weight="800" font-family="sans-serif">02 HEAVY STRIKE | 0.75s</text>
  <ellipse cx="528" cy="198" rx="41" ry="11" fill="#2e2834"/>
  <use href="#fighter" xlink:href="#fighter" xmlns:xlink="http://www.w3.org/1999/xlink" x="528" y="175"/>
  <path d="M557 170 L674 96 Q722 169 674 238 Z" fill="#ffbe7e" fill-opacity=".27" stroke="#ffd294" stroke-width="4" stroke-dasharray="9 7"/>
  <path d="M558 172 Q609 156 651 170" fill="none" stroke="#fff0bc" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="612" y="257" fill="#ffedbd" font-size="17" font-weight="700" font-family="sans-serif">EXIT FRONT ARC</text>
</svg>
